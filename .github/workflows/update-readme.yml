name: Auto Generate README in Pull Request

on:
  pull_request:
    branches:
      - master
    paths:
      - '**/*.md'
      - 'scripts/generate_readme.py'
      - '**/*.yml'

jobs:
  generate-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Skip if PR author is GitHub Actions bot
        run: |
          if [ "${{ github.event.pull_request.user.login }}" = "github-actions[bot]" ]; then
            echo "Skipping because PR was created by the bot."
            exit 0
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install PyYAML pathlib

      - name: Generate README
        run: |
          python scripts/generate_readme.py

      - name: Commit README into PR branch
        run: |
          git config user.name "${{ github.event.pull_request.user.login }}"
          git config user.email "${{ github.event.pull_request.user.login }}@users.noreply.github.com"
          git add README.md
          git diff --quiet --cached || git commit -m "Auto-update README (PR)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
